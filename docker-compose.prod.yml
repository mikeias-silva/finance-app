# Produção — Oracle Cloud, Ubuntu, VM.Standard.E2.1.Micro (1 OCPU, 1 GB RAM).
#
# Uso:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Difere do docker-compose.yml de desenvolvimento em:
#   - publica na porta 80 (acesso direto pelo IP)
#   - limites de memória por serviço, para o kernel não matar o processo errado
#     se algo escapar do controle
#   - php.ini de produção (opcache sem revalidação) e pool FPM ondemand
#   - código montado como somente-leitura no php, exceto storage e o banco

services:

  nginx:
    image: nginx:1.27-alpine
    container_name: finance_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php:
        condition: service_healthy
    mem_limit: 64m
    networks:
      - finance_net

  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: finance_php
    restart: always
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.prod.ini:/usr/local/etc/php/conf.d/99-custom.ini:ro
      - ./docker/php/www.conf:/usr/local/etc/php-fpm.d/zz-www.conf:ro
    environment:
      APP_ENV:          production
      APP_DEBUG:        "false"
      APP_URL:          ${APP_URL:-http://137.131.228.2}
      APP_KEY:          ${APP_KEY:?APP_KEY nao definida - rode php artisan key:generate}
      DB_CONNECTION:    sqlite
      DB_DATABASE:      /var/www/html/database/database.sqlite
      CACHE_STORE:      file
      SESSION_DRIVER:   file
      QUEUE_CONNECTION: sync
      LOG_CHANNEL:      stderr
      # Credenciais do Pluggy vêm do .env do servidor, nunca do repositório
      PLUGGY_CLIENT_ID:      ${PLUGGY_CLIENT_ID}
      PLUGGY_CLIENT_SECRET:  ${PLUGGY_CLIENT_SECRET}
      PLUGGY_ITEM_ID_NUBANK: ${PLUGGY_ITEM_ID_NUBANK}
      PLUGGY_ITEM_ID_CAIXA:  ${PLUGGY_ITEM_ID_CAIXA}
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t 2>&1 | grep -q 'test is successful'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 420m
    networks:
      - finance_net

networks:
  finance_net:
    driver: bridge
