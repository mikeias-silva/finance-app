services:

    # ─────────────────────────────────────────────
    # Nginx — proxy reverso, serve assets estáticos
    # ─────────────────────────────────────────────
    nginx:
        image: nginx:1.27-alpine
        container_name: finance_nginx
        restart: unless-stopped
        ports:
            - "${APP_PORT:-8080}:80"
        volumes:
            - ./:/var/www/html:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            php:
                condition: service_healthy
        networks:
            - finance_net

    # ─────────────────────────────────────────────
    # PHP-FPM 8.5 — processa o Laravel
    # ─────────────────────────────────────────────
    php:
        build:
            context: ./docker/php
            dockerfile: Dockerfile
        container_name: finance_php
        restart: unless-stopped
        volumes:
            - ./:/var/www/html
            - ./docker/php/php.ini:/usr/local/etc/php/conf.d/99-custom.ini:ro
        environment:
            APP_ENV:          ${APP_ENV:-production}
            APP_KEY:          ${APP_KEY:-}
            APP_DEBUG:        ${APP_DEBUG:-false}
            APP_URL:          ${APP_URL:-http://localhost:8080}
            DB_CONNECTION:    sqlite
            DB_DATABASE:      /var/www/html/database/database.sqlite
            CACHE_DRIVER:     file
            SESSION_DRIVER:   file
            QUEUE_CONNECTION: sync
        healthcheck:
            test: ["CMD-SHELL", "php-fpm -t 2>&1 | grep -q 'test is successful'"]
            interval: 10s
            timeout: 5s
            retries: 3
        networks:
            - finance_net

networks:
    finance_net:
        driver: bridge
