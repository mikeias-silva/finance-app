; ─────────────────────────────────────────────
; PHP customizado para Laravel / Finance App
; ─────────────────────────────────────────────

[PHP]
; Limites
memory_limit        = 256M
max_execution_time  = 60
max_input_time      = 60
post_max_size       = 20M
upload_max_filesize = 20M

; Timezone Brasil
date.timezone = America/Sao_Paulo

; Erros (ajuste em produção)
display_errors    = Off
log_errors        = On
error_log         = /dev/stderr
error_reporting   = E_ALL

; ─────────────────────────────────────────────
; OPcache — melhora muito a performance
; ─────────────────────────────────────────────
[opcache]
opcache.enable                 = 1
opcache.enable_cli             = 1
opcache.memory_consumption     = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files  = 20000
opcache.revalidate_freq        = 0   ; 0 = nunca revalida (ideal em prod/dev com restart)
opcache.validate_timestamps    = 1   ; mude para 0 em produção
opcache.save_comments          = 1   ; necessário para anotações Laravel
opcache.fast_shutdown          = 1
