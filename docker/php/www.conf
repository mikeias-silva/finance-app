; Pool do PHP-FPM ajustado para máquina de 1 GB (OCI VM.Standard.E2.1.Micro).
;
; O padrão do PHP (pm = dynamic, 5 filhos sempre vivos) consome memória demais
; nesse tamanho. Com ondemand os processos sobem só quando chega requisição e
; morrem depois de ociosos — para uso pessoal, com poucos acessos simultâneos,
; a diferença de latência é irrelevante e sobra RAM para o resto do sistema.

[www]
user  = app
group = app

listen = 9000

pm = ondemand
pm.max_children      = 4
pm.process_idle_timeout = 30s
pm.max_requests      = 200

; Reinicia o pool se o master morrer, em vez de derrubar o container
;emergency_restart_threshold = 3
;emergency_restart_interval  = 1m

; Erros vão para o stdout do container, capturados pelo docker logs
catch_workers_output = yes
decorate_workers_output = no
php_admin_value[error_log] = /dev/stderr
php_admin_flag[log_errors] = on

; Health check do compose usa isso
ping.path     = /ping
ping.response = pong
