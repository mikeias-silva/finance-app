; PHP de produção — máquina de 1 GB.
; Difere do php.ini de desenvolvimento nos limites de memória, menores para
; caber junto com nginx e o sistema.

[PHP]
memory_limit        = 192M
max_execution_time  = 60
max_input_time      = 60
post_max_size       = 20M
upload_max_filesize = 20M

date.timezone = America/Sao_Paulo

display_errors  = Off
log_errors      = On
error_log       = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED

; Não revela a versão do PHP nos headers
expose_php = Off

[opcache]
opcache.enable                  = 1
opcache.enable_cli              = 0
; 96M em vez de 128M: sobra RAM para os workers na máquina pequena
opcache.memory_consumption      = 96
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files   = 20000
; O deploy aqui é cópia de arquivo por SFTP, sem restart do container. Checar o
; mtime a cada request custa um stat() por arquivo incluído — irrelevante para
; um único usuário, e evita servir código antigo depois de subir um arquivo.
opcache.validate_timestamps     = 1
opcache.revalidate_freq         = 0
opcache.save_comments           = 1
opcache.fast_shutdown           = 1
