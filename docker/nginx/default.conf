server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    # ─────────────────────────────────────────
    # Charset e logs
    # ─────────────────────────────────────────
    charset utf-8;
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # ─────────────────────────────────────────
    # Gzip — reduz trafego de assets
    # ─────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_proxied    expired no-cache no-store private auth;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ─────────────────────────────────────────
    # Tamanho máximo de upload (deve bater com php.ini)
    # ─────────────────────────────────────────
    client_max_body_size 20M;

    # ─────────────────────────────────────────
    # Rota principal — tudo vai para o Laravel
    # ─────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ─────────────────────────────────────────
    # Passa .php para o PHP-FPM
    # ─────────────────────────────────────────
    location ~ \.php$ {
        fastcgi_pass   php:9000;     # nome do serviço no docker-compose
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include        fastcgi_params;

        fastcgi_read_timeout        300;
        fastcgi_buffer_size         16k;
        fastcgi_buffers             4 16k;
        fastcgi_busy_buffers_size   32k;
        fastcgi_temp_file_write_size 32k;
    }

    # ─────────────────────────────────────────
    # Cache agressivo para assets compilados (Vite)
    # ─────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires     1y;
        add_header  Cache-Control "public, immutable";
        access_log  off;
    }

    # ─────────────────────────────────────────
    # Bloqueia acesso a arquivos sensíveis
    # ─────────────────────────────────────────
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~ /\.env {
        deny all;
    }
}
