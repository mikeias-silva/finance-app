# Produção: HTTPS com certificado do Let's Encrypt emitido para o IP. Ele vale
# 6 dias e é renovado pelo cron do servidor (ver DEPLOY.md). A porta 80 só
# responde à validação do Let's Encrypt e manda o resto para o HTTPS.
# Sem HSTS: navegadores não o aplicam a endereço IP, e uma renovação que falhe
# deixaria o site inacessível em vez de só avisar.
server {
    listen 80;
    server_name _;

    # Validação do Let's Encrypt: precisa responder pela porta 80.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/finance-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/finance-ip/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:1m;
    ssl_session_timeout 1d;

    root /var/www/html/public;
    index index.php;

    # ─────────────────────────────────────────
    # Charset e logs
    # ─────────────────────────────────────────
    charset utf-8;
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # ─────────────────────────────────────────
    # Gzip — reduz trafego de assets
    # ─────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_proxied    expired no-cache no-store private auth;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ─────────────────────────────────────────
    # Tamanho máximo de upload (deve bater com php.ini)
    # ─────────────────────────────────────────
    client_max_body_size 20M;

    # ─────────────────────────────────────────
    # Rota principal — tudo vai para o Laravel
    # ─────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ─────────────────────────────────────────
    # Passa .php para o PHP-FPM
    # ─────────────────────────────────────────
    location ~ \.php$ {
        fastcgi_pass   php:9000;     # nome do serviço no docker-compose
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include        fastcgi_params;

        fastcgi_read_timeout        300;
        fastcgi_buffer_size         16k;
        fastcgi_buffers             4 16k;
        fastcgi_busy_buffers_size   32k;
        fastcgi_temp_file_write_size 32k;
    }

    # ─────────────────────────────────────────
    # Cache agressivo para assets compilados (Vite)
    # ─────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires     1y;
        add_header  Cache-Control "public, immutable";
        access_log  off;
    }

    # ─────────────────────────────────────────
    # Bloqueia acesso a arquivos sensíveis
    # ─────────────────────────────────────────
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~ /\.env {
        deny all;
    }
}
